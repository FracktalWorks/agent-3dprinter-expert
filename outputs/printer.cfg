[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3C0058000E504B5735313920-if00
restart_method: command

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 7000
max_z_velocity: 15
max_z_accel: 500
square_corner_velocity: 5.0

[tmc5160 stepper_x]
cs_pin: PD8
spi_bus: spi2
run_current: 1.2
hold_current: 0.8
interpolate: True
stealthchop_threshold: 0
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 128
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 5
driver_HSTRT: 7
driver_PWM_AUTOSCALE: True

[stepper_x]
step_pin: PA10
dir_pin: !PA14
enable_pin: !PA13
microsteps: 16
rotation_distance: 32
endstop_pin: ^PD3
position_endstop: 0
position_max: 200
homing_speed: 50
homing_positive_dir: false
homing_retract_dist: 5

[tmc5160 stepper_y]
cs_pin: PD9
spi_bus: spi2
run_current: 1.2
hold_current: 0.8
interpolate: True
stealthchop_threshold: 0
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 128
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 5
driver_HSTRT: 7
driver_PWM_AUTOSCALE: True

[stepper_y]
step_pin: PC8
dir_pin: PC9
enable_pin: !PA15
microsteps: 16
rotation_distance: 32
endstop_pin: ^PD2
position_endstop: 200
position_max: 200
homing_speed: 50
homing_positive_dir: true
homing_retract_dist: 5

[tmc5160 stepper_z]
cs_pin: PB10
spi_bus: spi2
run_current: 1.2
hold_current: 0.8
interpolate: True
stealthchop_threshold: 0
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 128
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 5
driver_HSTRT: 7
driver_PWM_AUTOSCALE: True

[stepper_z]
step_pin: PC6
dir_pin: PC7
enable_pin: !PA9
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC3
position_endstop: 0
position_max: 200
homing_speed: 8

[tmc5160 extruder]
cs_pin: PB2
spi_bus: spi2
run_current: 0.85
hold_current: 0.5
interpolate: True
stealthchop_threshold: 0
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 128
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 5
driver_HSTRT: 7
driver_PWM_AUTOSCALE: True

[extruder]
step_pin: PB12
dir_pin: !PB11
enable_pin: !PA8
microsteps: 16
rotation_distance: 8.0
gear_ratio: 1:1
nozzle_diameter: 2.0
filament_diameter: 2.0
max_extrude_only_distance: 5000
max_extrude_only_velocity: 100
max_extrude_only_accel: 500
min_extrude_temp: 0
heater_pin: PC5
sensor_type: temperature_mcu
control: watermark
min_temp: 0
max_temp: 100

[tmc5160 extruder1]
cs_pin: PA6
spi_bus: spi2
run_current: 0.85
hold_current: 0.5
interpolate: True
stealthchop_threshold: 0
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 128
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 5
driver_HSTRT: 7
driver_PWM_AUTOSCALE: True

[extruder1]
step_pin: PB0
dir_pin: PB1
enable_pin: !PC4
step_pulse_duration: 0.000005
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 2.642
gear_ratio: 1:1
nozzle_diameter: 2.0
filament_diameter: 2.0
max_extrude_only_distance: 5000
max_extrude_only_velocity: 100
max_extrude_only_accel: 500
min_extrude_temp: 0
heater_pin: PA7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA2
control: watermark
min_temp: -100
max_temp: 500

[fan]
pin: PA4

[display_status]
[respond]
default_type: echo
[pause_resume]
--- Clay macros included ---
