########################################
# PRINTER_JULIA250.cfg
# Julia 250: CoreXY, single nozzle, 250 x 250 x 250
# BTT Manta M5P (STM32G0B1) + TD-01 RP2040 CAN toolhead
# Author: Vijay Raghav Varada
# Version: 1
########################################

########################################
# Core Configs, Common to all printers
[include CORE_GCODE_MACROS.cfg]
########################################

########################################
# Select Any One Printer Family Series
# Julia uses the Manta M5P: BASE_DRAGON.cfg / BASE_TWINDRAGON.cfg are M8P pin maps
[include BASE_JULIA.cfg]
########################################

########################################
# include Add-Ons
# T0_FILAMENT_*_SENSOR.cfg, MAG_DOOR.cfg and ELECTRONICS_CHAMBER_COOLING.cfg
# use Manta M8P pins (MAG_DOOR.cfg PA5 = heated bed on the M5P): do not include
########################################


########################################
# Select Any One Toolhead0 Configuration
[include TOOLHEADS_TD-01_TOOLHEAD0.cfg]
#[include TOOLHEADS_TD-02_TOOLHEAD0.cfg]
########################################


########################################
# PRINTER_VARIABLES - Julia 250 Specific
########################################

[gcode_macro PRINTER_VARIABLES]
# Offset coordinates for dual_carriage
variable_offset_x: 0
variable_offset_y: 0
variable_offset_z: 0
# Autopark parameters
## default autopark: 0:inactive - 1:active
variable_autopark: 1
variable_z_hop: 0.6
variable_movespeed: 200 #mm/s
variable_feedrate: 6000 #mm/min
# HeatBed size
variable_bed_x_min: 0
variable_bed_x_max: 250
variable_bed_y_min: 0
variable_bed_y_max: 250
variable_bed_z_min: 0
variable_bed_z_max: 290
# Print cooling fans names
variable_fan0: 'extruder_CF'
# Pause Positions
variable_tool0_pause_position_x: 5
variable_tool0_pause_position_y: 5
# Printer Configuration
variable_is_dual_nozzle: 0
variable_ptfe_tube_length: 900
# Bed Calibration Positions
variable_bed_calibration_x1: 25
variable_bed_calibration_y1: 25
variable_bed_calibration_x2: 225
variable_bed_calibration_y2: 25
variable_bed_calibration_x3: 125
variable_bed_calibration_y3: 225
variable_bed_calibration_x4: 125
variable_bed_calibration_y4: 125
gcode:
    G90


########################################
# Printer Kinematics
########################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
minimum_cruise_ratio: 0
square_corner_velocity: 5
max_z_velocity: 15
max_z_accel: 100


########################################
# X Axis (endstop at X min, on the toolhead)
########################################

[stepper_x]
position_endstop: 0
position_min: 0
position_max: 250


########################################
# Y Axis (endstop at Y max, MIN1 = PD3)
########################################

[stepper_y]
position_endstop: 250
position_max: 250
position_min: 0


########################################
# Z Axis (endstop at Z max, MIN2 = PD2)
########################################

[stepper_z]
position_endstop: 295
position_max: 295
position_min: -6


########################################
# Input Shaping and Resonance
########################################

[resonance_tester]
probe_points:
    125,125,20
accel_chip: adxl345 toolhead0

# The TD-01 accelerometer sits rotated on this carriage: gravity reads on chip +x,
# a +X move on chip -y, a +Y move on chip -z (measured 2026-10-29). Overrides the
# axes_map in TOOLHEADS_TD-01_TOOLHEAD0.cfg, which other machines share
[adxl345 toolhead0]
axes_map: -y, -z, x


########################################
# Bed Mesh
########################################

[bed_mesh]
mesh_min: 25, 25
mesh_max: 225, 225
probe_count: 3,3
speed: 150
