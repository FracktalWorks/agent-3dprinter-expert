########################################
# BASE_JULIA.cfg
# Main MCU/Motherboard Configuration for the Julia series
# BTT Manta M5P V1.0 (STM32G0B1, USB-to-CAN bridge) + TD-01 RP2040 CAN toolhead
# CoreXY, single nozzle, TMC5160 (SPI) on M1/M2/M3
# Pins: BTT Manta M5P V1.0 pinout + klipper config/generic-bigtreetech-manta-m5p.cfg
# Author: Vijay Raghav Varada
# Version: 1
########################################

########################################
# TMC5160 SPI (Manta M5P SPI header, software SPI)
# SCK PB13, MISO PB14, MOSI PB15
# Driver sockets need the SPI jumpers fitted (BTT M5P manual)
########################################

########################################
# A Stepper (CoreXY) - M2
# Endstop on the toolhead: see TOOLHEADS_TD-01_TOOLHEAD0.cfg
# A/B swapped and both dirs inverted (M1 = B, M2 = A): with M1 = A, X ran
# backwards and Y forwards. Verified on the machine 2026-10-29
########################################

[stepper_x]
step_pin: PA10
dir_pin: PA14
enable_pin: !PA13
microsteps: 16
rotation_distance: 40  # GT2 20T pulley
homing_speed: 60
homing_retract_dist: 10.0

[tmc5160 stepper_x]
cs_pin: PD8
spi_software_sclk_pin: PB13
spi_software_miso_pin: PB14
spi_software_mosi_pin: PB15
interpolate: False
run_current: 1.20
hold_current: 0.60
sense_resistor: 0.075

########################################
# B Stepper (CoreXY) - M1
########################################

[stepper_y]
step_pin: PC8
dir_pin: PC9
enable_pin: !PA15
microsteps: 16
rotation_distance: 40  # GT2 20T pulley
endstop_pin: ^PD2
homing_speed: 60
homing_retract_dist: 10.0

[tmc5160 stepper_y]
cs_pin: PD9
spi_software_sclk_pin: PB13
spi_software_miso_pin: PB14
spi_software_mosi_pin: PB15
interpolate: False
run_current: 1.20
hold_current: 0.60
sense_resistor: 0.075

########################################
# Z Stepper - M3
# Z endstop at Z max (bed moves away from nozzle on homing), MIN3
########################################

[stepper_z]
step_pin: PC6
dir_pin: !PC7
enable_pin: !PA9
microsteps: 8
rotation_distance: 4
endstop_pin: ^PC3
homing_speed: 15
homing_retract_dist: 5.0

[tmc5160 stepper_z]
cs_pin: PB10
spi_software_sclk_pin: PB13
spi_software_miso_pin: PB14
spi_software_mosi_pin: PB15
interpolate: False
run_current: 1.00
hold_current: 0.50
sense_resistor: 0.075

########################################
# Heater Bed (HB = PA5, TB = PA0)
########################################

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_kp: 45.874
pid_ki: 1.335
pid_kd: 393.945
pwm_cycle_time: 0.3
min_temp: 0
max_temp: 150

########################################
# Probe and ABL (Probe / IND-DET header sense pin = PC15)
########################################

[probe]
pin: PC15
x_offset: 0
y_offset: 0
#z_offset: -0.2
sample_retract_dist: 2.0
speed: 4
lift_speed: 10
samples_tolerance: 0.05
samples:1
samples_result: average
samples_tolerance_retries : 8

########################################
# Bed Mesh & Exclude Objects
########################################

[bed_mesh]
horizontal_move_z: 5
probe_count: 5,5
algorithm: bicubic

########################################
# Input Shaping
########################################

[input_shaper]

########################################
# Single Nozzle Configuration
########################################

[respond]
default_type: echo

########################################
# Misc.
########################################

[delayed_gcode STARTUP]
initial_duration: 1
gcode:
    SET_LED LED=toolhead0 GREEN=1.0

########################################
# Single Nozzle Tool Management
########################################

# For single nozzle printer, T0 is always active, T1 commands are ignored with message
[gcode_macro T0]
description: Tool 0 (already active on single nozzle printer)
gcode:
    RESPOND TYPE=echo MSG="Active Extruder: 0"
    SET_GCODE_OFFSET X=0 Y=0 Z={printer.save_variables.variables.babystep_z|default(0.0)}


[gcode_macro T1]
description: Tool 1 not available on single nozzle printer
gcode:
    RESPOND TYPE=echo MSG="Active Extruder: 0"

########################################
# Temperature & Fans (Single Nozzle)
########################################

[gcode_macro M106]
description: Set print cooling fan speed for single nozzle
gcode:
    {% set raw_speed = params.S|default(0)|float %}
    {% set fan_speed = (raw_speed / 255.0)|round(2) %}
    {% if (params.P) is defined %}
        {% if (params.P)|int == 0 %}
            SET_FAN_SPEED FAN=extruder_CF SPEED={fan_speed}
        {% else %}
            RESPOND TYPE=echo MSG="Fan P{params.P} not available on single nozzle printer"
        {% endif %}
    {% else %}
        SET_FAN_SPEED FAN=extruder_CF SPEED={fan_speed}
    {% endif %}

[gcode_macro M107]
description: Turn off print cooling fan
gcode:
    M106 S0

# Override M104 to handle T1 commands gracefully on single nozzle
[gcode_macro M104]
rename_existing: M104.1
description: Set extruder temperature (single nozzle)
gcode:
    {% set temp = params.S|default(0)|float %}
    {% set tool = params.T|default(0)|int %}
    {% if tool == 0 or tool == -1 %}
        M104.1 S{temp}
    {% elif tool == 1 %}
        RESPOND TYPE=echo MSG="T1 not available on single nozzle printer, ignoring M104 T1"
    {% else %}
        RESPOND TYPE=error MSG="Invalid tool T{tool}"
    {% endif %}

# Override M109 to handle T1 commands gracefully on single nozzle
[gcode_macro M109]
rename_existing: M109.1
description: Set extruder temperature and wait (single nozzle)
gcode:
    {% set temp = params.S|default(0)|float %}
    {% set tool = params.T|default(0)|int %}
    {% if tool == 0 or tool == -1 %}
        M109.1 S{temp}
    {% elif tool == 1 %}
        RESPOND TYPE=echo MSG="T1 not available on single nozzle printer, ignoring M109 T1"
    {% else %}
        RESPOND TYPE=error MSG="Invalid tool T{tool}"
    {% endif %}

########################################
# PAUSE & Resume Functionality for Single Nozzle
########################################

[pause_resume]

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set z = params.Z|default(2.5)|float %}                                                                          ;Zhop on Pause
    {% set r = params.R|default(2.0)|float %}                                                                       ;Retract on Pause
    {% if printer['pause_resume'].is_paused|int == 0 %}                                                             ;if PAUSE was already called, skip
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target|default(0)|int}        ; set hotend temp variable for reference in resume macro
        SAVE_GCODE_STATE NAME=PAUSE                                                                                 ; save current print position for resume
        BASE_PAUSE                                                                                                  ; Pause print
        {% if printer.toolhead.homed_axes == "xyz" %}
            {% if printer.extruder.temperature >= 150 %}
                G91                                                                                                         ; relative positioning
                G1 E-{r} F600                                                                                           ; retract filament
                G90                                                                                                         ; absolute positioning
            {% endif %}

            {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}                              ; check that zhop doesn't exceed z max
                G91                                                                                                     ; relative positioning
                G1 Z{z} F900                                                                                            ; raise Z up by z hop amount
                G90                                                                                                         ; absolute positioning
            {% else %}
                RESPOND TYPE=echo MSG="Pause zhop exceeds maximum Z height."                                         ; if z max is exceeded, show message
            {% endif %}
            G1 X{printer_var.tool0_pause_position_x} Y{printer_var.tool0_pause_position_y} F{printer_var.feedrate}                   ; park toolhead at pause position
        {% else %}
            RESPOND TYPE=echo MSG="Pause movement skipped (axes not homed)"
            {% if printer.extruder.temperature >= 150 %}
                G91                                                                                                         ; relative positioning
                G1 E-{r} F600                                                                                               ; retract filament if possible
                G90                                                                                                         ; absolute positioning
            {% endif %}
        {% endif %}
        M106 S0                                                                                                     ; turn off part cooling fan
    {% endif %}

[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% if printer.toolhead.homed_axes == "xyz" %}
        G90
        G1 X{printer_var.tool0_pause_position_x} Y{printer_var.tool0_pause_position_y} F7000
        G1 X{printer_var.tool0_pause_position_x + 40} F7000
        G1 X{printer_var.tool0_pause_position_x}
        G1 X{printer_var.tool0_pause_position_x + 40}
        G1 X{printer_var.tool0_pause_position_x}
    {% else %}
        RESPOND TYPE=echo MSG="CLEAN_NOZZLE skipped (axes not homed)"
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_etemp: 0
variable_etemp1: 0
variable_activetool: 0
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set e = params.E|default(20)|float %}                      ; hotend prime amount (mm)
    {% set r = params.R|default(1)|float %}                       ; retract recovery (mm)
    {% if printer['pause_resume'].is_paused|int != 1 %}
        RESPOND TYPE=echo MSG="RESUME ignored (not paused)"
    {% else %}
        ; Restore temps (non-blocking first)
        {% if etemp > 0 %} M104 T0 S{etemp|int} {% endif %}
        {% if etemp1 > 0 %} M104 T1 S{etemp1|int} {% endif %}
        {% if etemp > 0 %}
            RESPOND TYPE=echo MSG="Heating extruder 0 .."
            M109 T0 S{etemp|int}
        {% endif %}
        {% if etemp1 > 0 %}
            RESPOND TYPE=echo MSG="Heating extruder 1 .."
            M109 T1 S{etemp1|int}
        {% endif %}

        {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|float %}
        {% set can_prime = (printer.extruder.temperature|float >= min_temp) %}

        {% if can_prime %}
            G91                                                                                                         ; relative positioning
            G1 E{e} F400                                                                                                ; prime nozzle first
            G1 E-{r} F600                                                                                               ; partial retract to prevent oozing during clean
            G90                                                                                                         ; absolute positioning
        {% endif %}

        CLEAN_NOZZLE
        M420 S1                                                                                                     ; restore bed mesh if available
        {% if printer.toolhead.homed_axes == "xyz" %}
            RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=150                                                       ; restore position (including Z)
        {% else %}
            RESPOND TYPE=echo MSG="RESUME position restore skipped (axes not homed)"
        {% endif %}

        {% if can_prime %}
            G91                                                                                                         ; relative positioning
            G1 E{r} F600                                                                                                ; final unretract to resume printing
            G90                                                                                                         ; absolute positioning
        {% endif %}

        BASE_RESUME VELOCITY=150
    {% endif %}
