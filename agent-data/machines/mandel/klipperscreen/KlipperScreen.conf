[main]
print_view: list

# No heaters on this machine, so the stock temperature and extrude panels are
# misleading. The clay panel replaces extrude.
[menu __main temperature]
enable: False

[menu __main extrude]
enable: False

[menu __main clay]
name: Clay
icon: extrude
panel: clay

[printer Printer]
hidden_sensors: extruder, extruder1
# Auger jog speeds offered on the clay panel, mm/s. Second value is the default.
extrude_speeds: 1, 2, 5, 10

[displayed_macros Printer]
co2_purge_stop: False
# Driven by the clay panel, not meant to be fired by hand.
clay_jog: False
extruders_sync: False
