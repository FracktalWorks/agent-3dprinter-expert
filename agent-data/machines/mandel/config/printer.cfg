[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3C0058000E504B5735313920-if00
restart_method: command

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 100
max_accel: 500
max_z_velocity: 100
max_z_accel: 200
square_corner_velocity: 5.0

[tmc5160 stepper_x]
cs_pin: PD8
spi_bus: spi2
run_current: 1.2
hold_current: 0.8
interpolate: True
stealthchop_threshold: 0
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 128
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 5
driver_HSTRT: 7
driver_PWM_AUTOSCALE: True

[stepper_x]
step_pin: PA10
dir_pin: !PA14
enable_pin: !PA13
microsteps: 16
rotation_distance: 32
endstop_pin: ^PD3
position_endstop: 0
position_max: 585
homing_speed: 80
homing_positive_dir: false
homing_retract_dist: 5

[tmc5160 stepper_y]
cs_pin: PD9
spi_bus: spi2
run_current: 1.2
hold_current: 0.8
interpolate: True
stealthchop_threshold: 0
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 128
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 5
driver_HSTRT: 7
driver_PWM_AUTOSCALE: True

[stepper_y]
step_pin: PC8
dir_pin: PC9
enable_pin: !PA15
microsteps: 16
rotation_distance: 32
endstop_pin: ^PD2
position_endstop: 200
position_max: 585
homing_speed: 80
homing_positive_dir: true
homing_retract_dist: 5

[tmc5160 stepper_z]
cs_pin: PB10
spi_bus: spi2
run_current: 1.2
hold_current: 0.8
interpolate: True
stealthchop_threshold: 0
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 128
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 5
driver_HSTRT: 7
driver_PWM_AUTOSCALE: True

[stepper_z]
step_pin: PC6
dir_pin: !PC7
enable_pin: !PA9
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC3
position_endstop: 585
position_min: 0
position_max: 585
homing_speed: 100
homing_positive_dir: true
homing_retract_dist: 5

[tmc5160 extruder]
cs_pin: PB2
spi_bus: spi2
sense_resistor: 0.022
# Auger torque. 1.8 -> 2.0 A RMS (2.83 A peak/phase): about 11% more torque,
# but 23% more heating, since torque goes with current and heat with its square.
# The driver has room — GLOBALSCALER was only ~44 of 256 — so the limit here is
# the MOTOR, whose rating is unknown. Check the auger motor by hand after a few
# minutes of running: too hot to keep a hand on means back this off.
#
# Microstepping is deliberately left at 16. Lowering it does NOT add torque:
# interpolate is True, so the TMC5160 reconstructs 256 microsteps internally
# whatever Klipper sends it, and the motor sees the same sinusoidal current
# either way. Peak torque is set by current alone. Coarser microstepping only
# lowers the step-pulse rate, and at 150 RPM that is 8k steps/s against ~80k
# at the ceiling, so there is nothing to gain and resolution to lose.
run_current: 2.0
hold_current: 1.0
interpolate: True
stealthchop_threshold: 0
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 128
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 5
driver_HSTRT: 7
driver_PWM_AUTOSCALE: True

[extruder]
step_pin: PB12
dir_pin: PB11
enable_pin: !PA8
# 16 microsteps, restored 2026-08-11.
#
# It was dropped to 1 for step-rate headroom on the argument that interpolate
# is True, so the TMC5160 rebuilds 256 microsteps internally and torque is
# unaffected. THAT ARGUMENT IS WRONG ABOUT SPEED. Interpolation smooths the
# current waveform between the steps it is given, but Klipper still commands
# one full step at a time, so the rotor is yanked 1.8 deg per pulse instead of
# 0.1125. That excites the motor's own resonance and the usable top speed under
# load falls — measured here as "I cannot move as fast as I was moving
# earlier". Full stepping buys pulse-rate headroom by spending torque at speed,
# which on a screw pushing clay is the wrong trade.
#
# 80,000 steps/s at 1500 RPM is the reason it was tempting, but 1500 RPM is a
# placeholder this auger has never reached: it stalls somewhere between 270 and
# 640 RPM, which is 14,000-34,000 steps/s. There is no step-rate problem here.
#
# rotation_distance is untouched either way, so no volumetric figure moves.
microsteps: 16
sensor_type: temperature_mcu
min_temp: -110
max_temp: 200
control: watermark
heater_pin: PC5
# VOLUMETRIC: E is mm3 of clay, not mm of anything. A screw has no filament,
# so this is its displacement per revolution:
#   pi/4 * (14^2 - 7^2) * (5.5 - 3.2) = 265.54 mm3/rev geometric
#   x 0.7366 volumetric efficiency    = 195.60 mm3/rev delivered
# The clay macros drive this at runtime; this is the cold-start value.
# Was 8.0, an arbitrary number that made E meaningless. Multiply the E values
# in any gcode written before 2026-08-10 by 24.45 to convert.
rotation_distance: 195.599
gear_ratio: 1:1
nozzle_diameter: 4.0
filament_diameter: 4.0
max_extrude_only_distance: 200000
max_extrude_only_velocity: 2000
# High enough that it never binds: the clay macros set the acceleration they
# want on the toolhead per jog, and Klipper takes the LOWER of the two. At
# 12000 this silently halved the 20000 the jog asked for, so every chunk took
# longer than the panel modelled and the queue slipped ~0.03s per chunk.
max_extrude_only_accel: 50000
# Klipper tests E-per-mm-of-XY against max_extrude_cross_section/filament_area,
# and here E is mm3, so the ratio IS the bead cross-section. With the nominal
# filament area pi/4*4^2 = 12.566 mm2, allowing a 40 mm2 bead (8mm wide x 5mm
# layer) means 40 x 12.566 = 502.7. filament_diameter must be >= nozzle_diameter
max_extrude_cross_section: 502.7
min_extrude_temp: -110

[tmc5160 extruder1]
cs_pin: PA6
spi_bus: spi2
sense_resistor: 0.022
run_current: 2.8
hold_current: 1.4
interpolate: True
# spreadCycle, always. The plunger is the highest-load axis on the machine —
# it pushes clay against back-pressure through a 10:1 gearbox — and stealthChop
# gives up torque for silence, stalling under load and acceleration. This was
# the only stepper here set to 999999; X/Y/Z and the auger all use 0 and run
# fine on the same 48V rail with the same TOFF/TBL chopper timings.
stealthchop_threshold: 0
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 128
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 5
driver_HSTRT: 7
driver_PWM_AUTOSCALE: True

[extruder1]
step_pin: PB0
dir_pin: PB1
enable_pin: !PC4
step_pulse_duration: 0.000005
# 16 microsteps, restored 2026-08-11 — see the note on [extruder] for why full
# stepping cost top speed rather than being free.
#
# This motor meters the delivered volume, so resolution matters here in its own
# right: at 16 microsteps the quantum is 0.402 mm3 = 0.08 mm of a 5.14 mm2
# bead. At full stepping it was 6.43 mm3 = 1.25 mm, coarse enough to band a
# wall at that pitch. 500 RPM costs 26,667 steps/s, which this machine ran for
# weeks without trouble.
#
# rotation_distance is untouched either way, so no volumetric figure moves.
microsteps: 16
sensor_type: Generic 3950
sensor_pin: PA2
min_temp: -110
max_temp: 500
control: watermark
heater_pin: PA7
full_steps_per_rotation: 200
# VOLUMETRIC, to match [extruder]: E mm3 per plunger motor revolution.
#   barrel area 3216.99 mm2 x 0.400 mm/rev = 1286.80 mm3/rev at balance 1.00
# MEASURED drivetrain: 250 motor revolutions moved the plunger 100mm, so
# 0.400 mm/rev (4mm lead through a 10:1 gearbox) = 8000 microsteps/mm.
# The clay macros multiply this by the balance at runtime.
rotation_distance: 1286.80
gear_ratio: 1:1
nozzle_diameter: 2.0
filament_diameter: 2.0
max_extrude_only_distance: 5000
max_extrude_only_velocity: 100
max_extrude_only_accel: 500
min_extrude_temp: -110


[temperature_sensor co2_chamber]
sensor_type: Generic 3950
sensor_pin: PA0

[fan]
pin: PA4

[display_status]
[respond]
default_type: echo
[pause_resume]
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    BASE_CANCEL_PRINT
    CLEAR_PAUSE
    SDCARD_RESET_FILE
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    SAVE_GCODE_STATE NAME=PAUSE_STATE
    BASE_PAUSE
[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    RESTORE_GCODE_STATE NAME=PAUSE_STATE
    BASE_RESUME

# Clay extrusion: auger + permanently-synced plunger, ratio control and
# the press-and-hold jog used by the KlipperScreen clay panel.
[include clay_macros.cfg]

# ── Manual Bed Levelling ─────────────────────────────────────────────────
[bed_screws]
screw1: 30, 30
screw1_name: Back-Left
screw2: 170, 30
screw2_name: Back-Right
screw3: 100, 170
screw3_name: Front-Center
horizontal_move_z: 5

[gcode_macro LEVEL_BED]
description: Manual bed levelling — lifts Z first, then adjusts 3 screws
gcode:
    G1 Z20 F500          ; Lift Z safely above bed
    BED_SCREWS_ADJUST

[gcode_macro LEVEL_CORNERS]
description: Move to 3 corners for manual check
gcode:
    G1 Z10 F300
    G1 X30 Y170 F6000
    M117 Corner 1: Front-Left
    G4 P2000
    G1 Z0 F100
    M117 Adjust Z to paper drag
    G4 P5000
    G1 Z10 F300
    G1 X170 Y170 F6000
    M117 Corner 2: Front-Right
    G1 Z0 F100
    G4 P5000
    G1 Z10 F300
    G1 X100 Y30 F6000
    M117 Corner 3: Back-Center
    G1 Z0 F100
    G4 P5000
    G1 Z10 F300
    G1 X100 Y100 F6000
    M117 Done — repeat if needed
