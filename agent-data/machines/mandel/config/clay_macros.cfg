# ============================================================================
# Clay extrusion control — MANDEL
# ============================================================================
# Included from printer.cfg:
#   [include clay_macros.cfg]
#
# Model
# -----
#   auger   = [extruder]   — always the active extruder, always the one G1 E drives
#   plunger = [extruder1]  — permanently slaved to the auger's motion queue
#
# EVERYTHING HERE IS VOLUMETRIC. One mm of commanded E is one mm3 of clay.
# That is the whole point of this file: the auger and the plunger are two
# different machines (a screw and a piston) and the only unit they share is
# volume, so a ratio between them is meaningless in any other unit.
#
#   [extruder]  rotation_distance = auger_vol_rev / balance
#   [extruder1] rotation_distance = barrel_area * plunger_base_rd
#
# THE PLUNGER CARRIES E, AND THE BALANCE LIVES ON THE AUGER. That is the whole
# point: one mm of E is one mm3 that actually leaves the nozzle, at any ratio,
# because the plunger's rotation distance never moves. The balance changes how
# far the SCREW turns to deliver it, which is the only thing a ratio should
# change.
#
# Getting this backwards costs exactly the balance factor. Putting the balance
# on the plunger instead starves it: at 1:16.5 a commanded 5.14 mm3 delivered
# 0.31 mm3, so a print asking for a normal bead came out at 6% of it and no
# amount of flow-percentage on the slicer could reach it.
#
# Both are set at runtime by _CLAY_APPLY, so changing the geometry or the
# balance takes effect immediately without a restart.
#
# Auger
# -----
# A screw has no "mm of filament", so its rotation distance was previously the
# fiction 8.0 — an arbitrary number that made E mean nothing. What a screw
# actually has is a displacement per revolution: the free volume of one turn of
# its channel.
#
#   V_geo = pi/4 * (od^2 - core^2) * (pitch - flight_thickness)
#         = pi/4 * (14^2 - 7^2) * (5.5 - 3.2) = 265.54 mm3/rev
#
# The flight is 3.2mm of the 5.5mm pitch, so 58% of the screw is metal and only
# 2.3mm per turn is open channel. That is a deliberately low-throughput,
# high-pressure screw, which is what you want for clay.
#
# Real screws never deliver their geometric volume — clay slips back over the
# flight tips and compresses — so the delivered volume is V_geo * auger_eff.
#
# Balance
# -------
# balance is the auger's share of a Plunger:Auger ratio, so 1:1.2 is balance
# 1.20. It is the number of auger revolutions' worth of E per unit of plunger
# travel, which is exactly the intuitive reading:
#
#   balance 1.00  plunger supplies precisely what the auger delivers
#   balance 1.20  auger turns 20% further for the same clay delivered — it works
#                 the material harder and pressure falls
#   balance 0.80  auger turns 20% less for the same clay — pressure builds
#
# The band runs 0.50 to 20.00. Note what the top of it costs. Raising the ratio
# means the auger must turn further for the same clay, so the auger motor
# becomes the binding limit and the flow ceiling falls in proportion:
#
#   1:1   100 mm3/s (max_flow binds)     1:25  100 mm3/s (max_flow still binds)
#   1:10  100 mm3/s (max_flow binds)      1:50   98 mm3/s (auger motor binds)
#
# _CLAY_RECALC derives that and re-clamps the working flow, so the ceiling shown
# on the panel drops as the ratio rises. Real, not a fault.
#
# Two things to know before working up there. From 1:2 onward the binding limit
# is auger_motor_max_rpm, which is an UNMEASURED placeholder — anything above
# about 1:3 is leaning on a guess until CLAY_AUGER_SPIN has found the real stall
# speed. And needing a very high ratio is itself evidence that auger_eff is
# wrong: if 1:20 is genuinely where the pressure sits, the screw is delivering
# ~3.7% of its geometric volume rather than 74%, and CLAY_AUGER_ZERO should be
# used to fold that back into auger_eff so the ratio returns to 1:1 and the flow
# figures start meaning something again.
#
# Be aware of what balance is NOT. Plunger -> auger -> nozzle is a sealed
# positive-displacement chain, so in steady state what leaves the nozzle equals
# what the plunger supplies, no matter what the auger does. Balance is therefore
# a PRESSURE trim, not a flow control — and because the plunger carries E, the
# output rate genuinely does not move when the ratio changes. Only auger speed
# does. Output rate is set by `flow` alone.
#
# Which also means auger_eff cannot be found by weighing what comes out — that
# only ever measures the plunger. The auger's true efficiency is the balance at
# which pressure holds steady: no ooze at pauses (over-supplied) and no thinning
# or stuttering (starved). Trim balance until it prints right, then run
# CLAY_AUGER_ZERO to adopt that trim as the new 1:1.
#
# auger_eff 0.7366 is not a guess: it is back-calculated from the ratio this
# machine printed with for months (0.0076 mm of plunger per mm of old auger E),
# which under the corrected plunger calibration works out to 195.6 mm3 per auger
# revolution = 73.7% of geometric. That is squarely where a clay screw belongs,
# and it means the settings below reproduce the machine's historical behaviour
# to within 0.003% while finally being expressed in real units.
#
# Plunger
# -------
# plunger_base_rd is MEASURED: 250 commanded motor revolutions moved the plunger
# 100mm, so 0.400 mm/rev — a 4mm lead through a 10:1 gearbox, giving 8000
# microsteps per mm of plunger travel. An earlier attempt read 0.205 mm/rev and
# was wrong: it predated the ACCEL guard in CLAY_CAL_MOVE and lost about half its
# steps to a 500 rev/s^2 ramp. Any recalibration must keep the acceleration low.
#
# Flow
# ----
# The one process setting is `flow`, in mm3/s of clay leaving the nozzle, which
# is also the E rate because E is plunger-referenced. RPM is each motor's
# private business, derived and never set:
#
#   auger_rpm   = flow * balance * 60 / auger_vol_rev
#   plunger_rpm = flow * 60 / (barrel_area * plunger_base_rd)
#
# Flow and balance are genuinely orthogonal: flow is what you want out of the
# nozzle, balance is how hard the screw works to deliver it.
#
# The ceiling is volumetric for the same reason: max_flow is THE limit and both
# motors' caps derive from it. Per-motor process limits would mean guessing twice
# and letting the smaller guess bind for no physical reason — which is exactly
# what an earlier hand-set 300 RPM auger cap was doing.
#
# Each motor additionally has its own hard limit (plunger_max_rpm,
# auger_motor_max_rpm) about the motor rather than the process. flow_cap folds
# all three together.
#
# Modes
# -----
# Two operations, two different machines:
#
#   EXTRUDE  the normal state. Plunger carries E, the balance sets auger speed,
#            flow is metered volumetrically, everything above applies.
#   LOAD     charging the barrel or clearing a blocked nozzle. BOTH motors run
#            flat out: the plunger at load_rpm (ceiling load_max_rpm) and the
#            auger at auger_motor_max_rpm, simultaneously. E is mm of plunger
#            travel.
#
# Load mode is still a synced state, but the ratio between the two is nothing
# like the printing one — it is simply "both as fast as they are allowed". The
# auger running is what makes this useful for unblocking rather than only for
# filling. The rotation distance that produces it falls straight out of wanting
# both at once:
#
#   plunger rd = plunger_base_rd                     -> E is mm of travel
#   auger   rd = load_rpm * plunger_base_rd / auger_motor_max_rpm
#
# so at 500 plunger RPM and a 1500 RPM auger ceiling the auger turns three times
# per plunger revolution. Change load_rpm and the auger stays pinned at its
# maximum, which is the point.
#
# Consequences worth knowing:
#   - LOAD is idle-only. It unsyncs and changes the active extruder, either of
#     which would wreck a running print.
#   - Acceleration drops to load_accel while loading. At 500 mm/s^2 the plunger
#     would be asked to reach full speed in 11 ms and would simply stall.
#     _CLAY_APPLY restores the configured value, so any resync undoes it.
#   - Anything that resyncs — CLAY_RESYNC, EXTRUDERS_SYNC at the top of a print,
#     leaving the clay panel — returns to EXTRUDE. The unsynced state is never
#     left lying around for a print to trip over.
#
# Settings persist across restarts in clay_vars.cfg via [save_variables].
# ============================================================================

[save_variables]
filename: ~/printer_data/config/clay_vars.cfg


# ── Idle motor shutdown ─────────────────────────────────────────────────────
# Release the extruder motors after a minute of standing still, so neither the
# auger nor the plunger sits there heating at hold current for no reason.
#
# Deliberately NOT the stock M84. Klipper's default idle gcode drops EVERY
# stepper, which would silently un-home the machine — and the clay print files
# contain a PAUSE for the operator popup that can easily outlast the timeout, so
# under the default the gantry would lose its position mid-print. Only the two
# extruder steppers are released here; XY/Z and homing are untouched.
#
# Nothing needs to re-enable them: a Klipper stepper re-arms itself as soon as a
# move requires it, so the next jog or extrusion just works.
#
# TURN_OFF_HEATERS is kept from the stock behaviour. Nothing on this machine
# heats today, but losing that property silently would be the wrong trade.
[idle_timeout]
timeout: 60
gcode:
    _CLAY_IDLE_OFF


[gcode_macro _CLAY_IDLE_OFF]
description: Release the extruder motors after idling (wired to [idle_timeout])
gcode:
    {% if 'heaters' in printer %}
        TURN_OFF_HEATERS
    {% endif %}
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    SET_STEPPER_ENABLE STEPPER=extruder1 ENABLE=0
    # A cancelled print never reaches CLAY_PRINT_END, and a cap left armed would
    # quietly slow the machine until someone worked out why. Idle is proof
    # enough that no print is running. Release the LIMIT too, not just the
    # variable — see the note in CLAY_PRINT_START.
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=print_bead VALUE=0
    _CLAY_TOOLHEAD_LIMITS
    RESPOND MSG="Clay: idle 60s - auger and plunger released, print cap cleared. XY/Z and homing untouched."



# ── State ───────────────────────────────────────────────────────────────────
[gcode_macro CLAY]
description: Clay extrusion state (auger + permanently synced plunger)
# -- plunger drivetrain (measured) --
variable_plunger_base_rd: 0.400    # MEASURED: 4mm lead / 10:1 gearbox = 0.4 mm per motor rev
variable_barrel_diameter: 64.0     # clay barrel bore, mm
# -- auger geometry (measured off the screw) --
variable_auger_od: 14.0            # flight outside diameter, mm
variable_auger_core: 7.0           # core/shaft diameter, mm
variable_auger_pitch: 5.5          # axial pitch, mm
variable_auger_flight: 3.2         # flight thickness measured along the axis, mm
variable_auger_eff: 0.7366         # delivered / geometric. See header; adopt a new
                                   # value with CLAY_AUGER_ZERO, do not guess one.
# -- derived, recomputed by _CLAY_RECALC. Never set these by hand. --
variable_auger_vol_rev: 195.60     # mm3 of clay per auger revolution
variable_barrel_area: 3216.99      # mm2
variable_flow_cap: 4289            # max_flow after both motor limits, mm3/s
variable_max_auger_rpm: 1316       # auger RPM at flow_cap
# -- process settings --
variable_balance: 25.00            # Plunger:Auger, auger side. Higher = auger pushes more
variable_balance_min: 0.50
variable_balance_max: 50.00
variable_balance_step: 0.05
variable_flow: 100                 # working flow out of the nozzle, mm3/s
variable_flow_step: 5
variable_flow_min: 5
# -- load mode: the plunger alone, in its own motor RPM --
variable_mode: 'extrude'           # 'extrude' or 'load'. Set by CLAY_MODE only.
variable_load_rpm: 500             # working plunger speed while loading
variable_load_rpm_step: 10
variable_load_rpm_min: 5
variable_load_max_rpm: 500         # load ceiling. Below the motor's 800 on purpose.
variable_load_accel: 100           # mm/s^2 of plunger travel while loading
variable_auger_max_accel: 300      # rev/s^2 the auger may be asked for, EVER
# Largest bead cross-section (mm2 per mm of travel) the running file will ask
# for, or 0 when no print is running. A flow ceiling cannot be turned into a
# speed ceiling without it: mm3/s = mm/s x mm2. Set by CLAY_PRINT_LIMITS.
variable_print_bead: 0.0
# Live Z offset, mm, applied by CLAY_PRINT_START. POSITIVE LIFTS THE NOZZLE.
#
# Clay is not filament: it will not squash into a bed contact the way a plastic
# first layer does, so a nozzle homed hard onto the bed ploughs rather than
# lays. A small positive offset gives the bead somewhere to go. It shifts the
# WHOLE print, not just layer one — the layer heights are untouched.
variable_z_offset: 0.5
variable_load_accel_eff: 40        # derived: load_accel after the auger's say
# Acceleration used for a press-and-hold jog in EXTRUDE mode, mm3/s^2.
#
# This is the whole reason a jog used to run on for about a second after the
# finger lifted. Klipper takes an extrude-only move's acceleration from the
# TOOLHEAD's max_accel and only ever lowers it from there, so a move that is
# pure E inherits 500 — and because E is mm3 here, that means 500 mm3/s^2.
# Decelerating from a 489 mm3/s jog therefore took 489/500 = 0.98s, dwarfing the
# 0.25s of queue the pacing was designed around. max_extrude_only_accel (12000)
# never got a say, because limit_speed() can only reduce.
#
# It has to be high enough for a single 50ms jog chunk to REACH the commanded
# speed, not merely to stop quickly. At 5000 mm3/s^2, reaching 489 mm3/s takes
# 0.098s — twice the length of a chunk — so no chunk ever got to cruise, the
# machine averaged a fraction of the requested flow, and the queue grew for the
# whole hold (measured: 1.5s deep after 2s, on top of everything else).
#
# 20000 mm3/s^2 reaches 489 mm3/s in 0.024s and stops in the same. On the motors
# that is 102 rev/s^2 at the auger, which sounds violent but is not: the rotor
# needs about 3 mNm to do it against a ~400 mNm holding torque, and clay is a
# viscous load that resists speed rather than acceleration. It also sets the
# floor on CHUNK_S in the panel (4*flow/accel), so raising it buys latency.
variable_jog_accel: 20000
# Speed ceiling for a press-and-hold jog, mm3/s.
#
# The same trap as jog_accel, and worse. Klipper clamps every move to the
# TOOLHEAD's max_velocity, extrude-only moves included — and [printer]
# max_velocity is 100, meant as 100 mm/s of XY. Because E is mm3 here, that
# silently capped extrusion at 100 mm3/s = 6 mL/min, a fifth of the 489 the
# panel was asking for. The panel then fed material faster than the machine
# could run it, so the queue grew for the whole hold (measured: 4.4s deep after
# a 2s press) and every bit of it came back as run-on.
#
# 1000 clears the 100 mm3/s ceiling ten times over, and is deliberately no
# larger: while a jog is in force this IS the toolhead's velocity limit, so if a
# release event were ever dropped it is also what an XY move would inherit.
# 1000 is survivable there in a way that 6000 was not. Raise it in step with
# max_flow if that ever goes up.
variable_jog_velocity: 1000
# -- ceilings --
# There is ONE extrusion ceiling in this machine and it is volumetric. Both
# motors deliver the same clay, so their limits are the same limit expressed in
# two different units; setting them independently would mean guessing twice and
# letting the smaller guess bind for no physical reason.
#
#   max_flow   THE process ceiling, mm3/s. Both motors' caps derive from it.
#
# Motor ceilings are a separate matter — what each motor can physically turn,
# independent of any process limit:
#   plunger_max_rpm       MEASURED: stalls near 1000 RPM, derated 80% to 800
#   auger_motor_max_rpm   UNMEASURED. High enough not to bind, so max_flow sets
#                         the ceiling. Lower it to 80% of whatever
#                         CLAY_AUGER_SPIN finds the screw actually stalls at.
#
# THE PLUNGER IS THE MASTER REFERENCE. `flow` and `max_flow` are both measured
# at the plunger — which is also what leaves the nozzle, since in steady state a
# sealed positive-displacement chain can deliver exactly what the piston
# supplies and no more. The auger's speed is derived from it, never the reverse.
#
# 200 mm3/s = 12 mL/min = 0.062 mm/s of plunger travel = 9.3 plunger RPM.
#
# Reaching it depends on the ratio. The auger has to turn flow*balance*60/195.6
# RPM to deliver it, so 200 mm3/s needs 1534 auger RPM at 1:25 — just past the
# 1500 placeholder in auger_motor_max_rpm, so flow_cap clamps a shade below it
# there. At 1:24 or lower the full 200 is available, and only if the auger
# really does manage 1500 RPM, which is still UNMEASURED.
variable_max_flow: 200
variable_max_flow_step: 5
variable_plunger_max_rpm: 800
variable_auger_motor_max_rpm: 1500
variable_auger_motor_max_rpm_step: 25
gcode:
    CLAY_STATUS


# ── Derived quantities ──────────────────────────────────────────────────────
# Cached rather than recomputed in every macro: they depend only on geometry and
# the balance, and having one place that owns the formulas keeps the auger's
# displacement from drifting out of step with the barrel's.
#
# flow_cap is the process ceiling after both motors have had their say, all three
# expressed as mm3/s out of the nozzle so that they can actually be compared:
#
#   max_flow                                              the process limit
#   plunger_max_rpm / 60 * barrel_area * plunger_base_rd  the plunger motor
#   auger_motor_max_rpm / 60 * auger_vol_rev / balance    the auger motor
#
# The auger term carries the balance because a higher balance means fewer mm3
# leave the nozzle per auger turn, so the same motor speed buys less flow.
[gcode_macro _CLAY_RECALC]
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    {% set v = 0.785398163 * (c.auger_od|float ** 2 - c.auger_core|float ** 2)
               * (c.auger_pitch|float - c.auger_flight|float) * c.auger_eff|float %}
    {% set a = 0.785398163 * c.barrel_diameter|float ** 2 %}
    {% set by_plunger = c.plunger_max_rpm|float * a * c.plunger_base_rd|float / 60 %}
    {% set by_auger = c.auger_motor_max_rpm|float * v / (60 * c.balance|float) %}
    {% set cap = [[c.max_flow|float, by_plunger]|min, by_auger]|min %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=auger_vol_rev VALUE={(v * 1000)|round(0)|int / 1000}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=barrel_area VALUE={(a * 100)|round(0)|int / 100}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=flow_cap VALUE={cap|round(0)|int}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=max_auger_rpm VALUE={(cap * c.balance|float * 60 / v)|round(0)|int}


# ── Enforce the synced state and apply the current geometry ─────────────────
# Internal (leading underscore keeps it out of the macro lists in the UIs).
[gcode_macro _CLAY_APPLY]
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    # Plunger: the master. E mm3 per plunger motor revolution, balance-free, so
    # one mm of E is one mm3 out of the nozzle whatever the ratio is set to.
    {% set prd = c.barrel_area|float * c.plunger_base_rd|float %}
    # Auger: the balance lives here. A higher ratio shortens the rotation
    # distance, so the screw turns further for the same delivered clay.
    {% set ard = c.auger_vol_rev|float / c.balance|float %}
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={ard}
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder1 DISTANCE={prd}
    # Re-asserting the sync IS returning to extrude mode; there is no synced
    # state that is still "loading". This is what makes leaving load mode
    # lying around harmless — the next resync of any kind clears it, including
    # the EXTRUDERS_SYNC at the top of every print file.
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=mode VALUE="'extrude'"
    # Restore ALL three jog limits, not just acceleration. CLAY_JOG_END normally
    # does this on release, but it only runs if the panel sees the release — and
    # a touchscreen that drops one would otherwise leave the toolhead at
    # 6000 mm/s and 20000 mm/s^2, which are E-axis figures that would be lethal
    # if a print started and applied them to XY. Any resync now clears them.
    # ...and, if a print is running, no faster than the auger can turn. This is
    # the line that makes the ratio chosen at the print-start pause govern the
    # print speed: RESUME calls _CLAY_APPLY, which lands here.
    _CLAY_TOOLHEAD_LIMITS


# THE PRINT-SPEED CAP — the machine's own guarantee, not the g-code's.
#
# Klipper does NOT bound an extruder during a printing move: check_move()
# applies max_e_velocity/max_e_accel only to extrude-only moves, and for a
# kinematic move it checks the cross-section ratio and nothing else. So a file
# asking for more flow than the screw can pass gets it, and the screw stalls
# with no error at all. The only lever that works is the TOOLHEAD's velocity,
# because flow follows from it:
#
#   flow (mm3/s)     = XY speed (mm/s) x bead (mm2)
#   auger (rev/s)    = flow / auger_rd
#   => XY speed cap  = auger_motor_max_rpm / 60 * auger_rd / bead
#   => XY accel cap  = auger_max_accel * auger_rd / bead
#
# auger_rd is auger_vol_rev/balance, so THE CAP CARRIES THE RATIO. Choose 1:10
# at the print-start pause and the print runs twice as fast as at 1:20, because
# the screw turns half as far per unit of clay. Choose 1:30 and the toolhead is
# slowed to suit. That is why this is recomputed on every apply — and why
# RESUME re-applies it — rather than being baked into a feedrate.
#
# Both limits only ever tighten the configured ones, so a bead the screw can
# keep up with leaves the printer at its normal speed.
[gcode_macro _CLAY_TOOLHEAD_LIMITS]
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    {% set cfg = printer.configfile.settings.printer %}
    {% set bead = c.print_bead|float %}
    # AND a print must actually be running. print_bead alone is not enough:
    # CLAY_PRINT_END only runs at the end of a SUCCESSFUL print, so a cancelled
    # or aborted one left the cap armed, and the next G28 crawled a 585 mm axis
    # at 9 mm/s with nothing on screen to explain why. Gating on print_stats
    # makes that impossible to leak — 'cancelled', 'complete' and 'standby' all
    # drop the cap on the next apply, without anyone having to remember.
    #
    # 'paused' is included because RESUME calls _CLAY_APPLY BEFORE BASE_RESUME,
    # so the state has not flipped to 'printing' yet at the moment the cap for
    # the resumed print is computed.
    {% set running = printer.print_stats.state in ('printing', 'paused') %}
    {% if bead > 0 and running %}
        {% set ard = c.auger_vol_rev|float / c.balance|float %}
        {% set v = [c.auger_motor_max_rpm|float / 60 * ard / bead, cfg.max_velocity]|min %}
        {% set a = [c.auger_max_accel|float * ard / bead, cfg.max_accel]|min %}
        SET_VELOCITY_LIMIT VELOCITY={'%.3f'|format(v)} ACCEL={'%.0f'|format(a)} MINIMUM_CRUISE_RATIO={cfg.minimum_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel} MINIMUM_CRUISE_RATIO={cfg.minimum_cruise_ratio}
    {% endif %}


# Arm the cap. Called by the g-code AFTER homing and the move to the start:
# the cap slows EVERY move, and a 585 mm Z homing sweep at 9 mm/s is a minute
# of watching nothing happen.
#
# Pass the LARGEST bead in the file. The cap is a velocity limit, not a flow
# limit, so sizing it on the largest bead leaves thinner layers running below
# the screw's ceiling — conservative in the safe direction, which is the only
# direction that may be got wrong.
[gcode_macro CLAY_PRINT_LIMITS]
description: BEAD=<mm2> — hold the toolhead to what the auger can deliver
gcode:
    {% set b = params.BEAD|default(0)|float %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=print_bead VALUE={b}
    _CLAY_RECALC
    _CLAY_APPLY
    {% set c = printer["gcode_macro CLAY"] %}
    {% if b > 0 %}
        {% set ard = c.auger_vol_rev|float / c.balance|float %}
        {% set raw = c.auger_motor_max_rpm|float / 60 * ard / b %}
        {% set v = [raw, printer.configfile.settings.printer.max_velocity]|min %}
        RESPOND MSG="Clay print cap: {'%.2f'|format(b)} mm2 bead at 1:{'%.2f'|format(c.balance|float)} -> XY <= {'%.2f'|format(v)} mm/s = {'%.0f'|format(v*b)} mm3/s at {c.auger_motor_max_rpm|int} auger RPM. Lower the ratio for more speed."
    {% endif %}


# HOMING IS ALWAYS FAST. This is a guarantee, not a convention.
#
# Gating the cap on print_stats stops it being RE-ARMED outside a print, but it
# cannot release a limit that is already set: SET_VELOCITY_LIMIT persists until
# something sets it again, and after a cancelled print nothing does. The machine
# then sits at the last cap it computed — 9 mm/s — and the next G28 crawls a
# 585 mm axis for a minute with nothing on screen to explain it. That has now
# been reported twice.
#
# So rather than trying to enumerate every way a print can end, put the release
# where the symptom is: homing is never an extruding move, so it can always have
# the configured limits. _CLAY_TOOLHEAD_LIMITS afterwards puts the cap back if a
# print is genuinely still running, so a mid-print G28 is not weakened.
# rename_existing MUST be another traditional G-code name (G28.1), not an
# extended one. Klipper's gcode_macro compares is_traditional_gcode(alias)
# against is_traditional_gcode(rename_existing) and refuses a mismatch:
#   "G-Code macro rename of different types ('G28' vs 'BASE_G28')"
# — which is a CONFIG error, so the printer will not start at all.
[gcode_macro G28]
rename_existing: G28.1
gcode:
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    G28.1 {rawparams}
    _CLAY_TOOLHEAD_LIMITS


# Cancelling is one of the ways a print ends, and the only one that reaches
# neither CLAY_PRINT_END nor the idle timeout promptly. Overrides the definition
# in printer.cfg: clay_macros.cfg is included after it, and Klipper's config
# parser is non-strict, so the later body wins (the same mechanism the RESUME
# override relies on). The original three commands are preserved verbatim.
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=print_bead VALUE=0
    _CLAY_TOOLHEAD_LIMITS
    BASE_CANCEL_PRINT
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    RESPOND MSG="Clay: print cancelled, speed cap released."


[gcode_macro CLAY_PRINT_END]
description: Release the print-speed cap
gcode:
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=print_bead VALUE=0
    _CLAY_TOOLHEAD_LIMITS
    RESPOND MSG="Clay: print cap released, toolhead back to configured limits."


# Pull the working flow back under the ceiling. Always run _CLAY_RECALC first:
# flow_cap depends on the balance, so clamping against a stale copy would let a
# motor outrun its limit.
[gcode_macro _CLAY_CLAMP_SPEED]
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    {% set s = [[c.flow|float, c.flow_cap|float]|min, c.flow_min|float]|max %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=flow VALUE={s|round(0)|int}
    SAVE_VARIABLE VARIABLE=clay_flow VALUE={s|round(0)|int}


[gcode_macro CLAY_MODE]
description: MODE=LOAD drives the plunger alone at full speed; MODE=EXTRUDE resyncs
gcode:
    # print_stats, not idle_timeout: a PAUSED print must still allow this, and
    # idle_timeout reports "Printing" for any activity at all, jogging included.
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("CLAY_MODE: not while printing") }
    {% endif %}
    {% set c = printer["gcode_macro CLAY"] %}
    {% set m = params.MODE|default('extrude')|lower %}
    {% if m == 'load' %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=mode VALUE="'load'"
        _CLAY_LOAD_APPLY
        RESPOND MSG="Clay LOAD: plunger alone at {c.load_rpm|int} RPM ({'%.2f'|format(c.load_rpm|float * c.plunger_base_rd|float / 60)} mm/s, ceiling {c.load_max_rpm|int}), auger parked. E is mm of plunger travel."

    {% else %}
        _CLAY_RECALC
        _CLAY_APPLY
        RESPOND MSG="Clay EXTRUDE mode: plunger synced to auger, E is mm3, flow {c.flow|int} mm3/s."
    {% endif %}


# Both motors, each at its own ceiling. Kept separate from _CLAY_APPLY because
# the two modes share no arithmetic at all: one is metered by volume, the other
# is simply everything at once.
[gcode_macro _CLAY_LOAD_APPLY]
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    # REVERTED 2026-08-11 to plunger-only. Driving the auger at its ceiling from
    # the same E axis was tried and abandoned: because auger_rd scales with
    # load_rpm, the auger's angular acceleration went as 1/rd and blew past what
    # stepcompress can encode at low load speeds (see
    # agent-data/klipper_motion_gotchas.md #2b), and even with the acceleration
    # bounded it never worked reliably on the machine. If the auger is wanted
    # for unblocking, run it from EXTRUDE mode or give it its own macro rather
    # than gearing it to the plunger.
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder1 DISTANCE={c.plunger_base_rd}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=load_accel_eff VALUE={c.load_accel}
    # Velocity pinned to the LOAD ceiling, so neither the setpoint nor the jog's
    # ramp compensation can push the plunger past load_max_rpm.
    SET_VELOCITY_LIMIT VELOCITY={c.load_max_rpm|float * c.plunger_base_rd|float / 60} ACCEL={c.load_accel} MINIMUM_CRUISE_RATIO=0


[gcode_macro CLAY_SET_LOAD_RPM]
description: Set the plunger speed used in LOAD mode, in motor RPM
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    {% set r = params.RPM|default(c.load_rpm)|float %}
    # Bounded by the load ceiling and, beneath that, by what the motor can do.
    {% set r = [[[r, c.load_max_rpm|float]|min, c.plunger_max_rpm|float]|min,
                c.load_rpm_min|float]|max %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=load_rpm VALUE={r|round(0)|int}
    SAVE_VARIABLE VARIABLE=clay_load_rpm VALUE={r|round(0)|int}
    # The auger's rotation distance is derived from load_rpm, so it has to be
    # re-applied whenever load_rpm moves, or the auger drifts off its ceiling.
    {% if c.mode == 'load' %}
        _CLAY_LOAD_APPLY
    {% endif %}
    RESPOND MSG="Load {r|round(0)|int} RPM = {'%.2f'|format(r * c.plunger_base_rd|float / 60)} mm/s of plunger travel (ceiling {c.load_max_rpm|int} RPM)"


# Called at the top of a print file. Homes, parks over the middle of the bed
# with the bed still at Z max, throws the touchscreen onto the clay panel and
# pauses — so the operator can run the auger and the plunger by hand and see
# real clay coming out before the first layer is committed.
#
# `action:ks_show clay` is KlipperScreen's own mechanism (screen.py
# parse_ks_action), not a patch: it routes straight to show_panel().
[gcode_macro CLAY_PRINT_START]
description: Home, park centre, hand the screen over for a flow check, then pause
gcode:
    {% set x = params.X|default(100)|float %}
    {% set y = params.Y|default(100)|float %}
    # Clear any stale cap first: homing and the park are not extruding moves and
    # have no reason to crawl at the screw's pace.
    #
    # BOTH LINES ARE REQUIRED. print_bead is only an input to the calculation —
    # SET_VELOCITY_LIMIT is what Klipper actually obeys, and it persists until
    # something sets it again. Clearing the variable alone left the toolhead
    # pinned at the last cap it had computed, and G28 then homed a 585 mm axis
    # at 9 mm/s. Symptom: "homing is too slow", with print_bead reading 0.
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=print_bead VALUE=0
    _CLAY_TOOLHEAD_LIMITS
    G28
    # AFTER G28, never before: homing resets the offset, so setting it first
    # would be silently discarded. MOVE=0 because nothing is at the bed yet.
    SET_GCODE_OFFSET Z={printer["gcode_macro CLAY"].z_offset} MOVE=0
    _CLAY_RECALC
    _CLAY_APPLY
    G1 X{x} Y{y} F6000
    M400
    M117 Check the flow, then RESUME
    RESPOND MSG="Clay: parked at centre, bed at Z max. Prime from the clay panel, set the ratio you want, then RESUME."
    # Fired from a delayed_gcode rather than inline, because PAUSE itself moves
    # KlipperScreen to job_status — switching before the pause would just be
    # overwritten a moment later.
    UPDATE_DELAYED_GCODE ID=_CLAY_SHOW_PANEL DURATION=1.5
    PAUSE


# Whatever ratio the operator settles on during that pause is the ratio the
# print runs at: RESUME re-applies the live balance, and nothing in the file
# overrides it.
[delayed_gcode _CLAY_SHOW_PANEL]
gcode:
    { action_respond_info("action:ks_show clay") }


# Any resume re-asserts the synced state. The operator may well have been in
# LOAD mode with the plunger unsynced a moment earlier, and nothing else would
# put it back before the print carried on.
[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    _CLAY_RECALC
    _CLAY_APPLY
    BASE_RESUME


[gcode_macro CLAY_RESYNC]
description: Re-assert auger/plunger sync and re-apply the current geometry
gcode:
    _CLAY_RECALC
    _CLAY_APPLY
    CLAY_STATUS


# Legacy name — files in ~/printer_data/gcodes still call this.
[gcode_macro EXTRUDERS_SYNC]
description: Deprecated alias for CLAY_RESYNC
gcode:
    _CLAY_RECALC
    _CLAY_APPLY


# ── Balance (the Plunger:Auger ratio) ───────────────────────────────────────
[gcode_macro CLAY_SET_BALANCE]
description: Set the Plunger:Auger balance. 1.00 = matched, 1.20 = auger pushes out more
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    {% set b = params.BALANCE|default(c.balance)|float %}
    {% set b = [[b, c.balance_max|float]|min, c.balance_min|float]|max %}
    {% set b = ((b * 100)|round(0)|int) / 100 %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=balance VALUE={b}
    SAVE_VARIABLE VARIABLE=clay_balance VALUE={b}
    _CLAY_RECALC
    _CLAY_APPLY
    _CLAY_CLAMP_SPEED
    RESPOND MSG="Clay balance 1:{'%.2f'|format(b)} -> plunger supplies {'%.1f'|format(c.auger_vol_rev|float / b)} mm3 per auger rev ({'%+.0f'|format((1/b - 1) * 100)}% vs matched)"


[gcode_macro CLAY_BALANCE_UP]
description: Auger pushes out more (pressure falls)
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    CLAY_SET_BALANCE BALANCE={c.balance|float + c.balance_step|float}


[gcode_macro CLAY_BALANCE_DOWN]
description: Plunger compresses more (pressure builds)
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    CLAY_SET_BALANCE BALANCE={c.balance|float - c.balance_step|float}


# ── Working speed ───────────────────────────────────────────────────────────
[gcode_macro CLAY_SET_FLOW]
description: Set the working flow out of the nozzle in mm3/s (clamped by both motors)
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=flow VALUE={params.FLOW|default(c.flow)|float}
    _CLAY_RECALC
    _CLAY_CLAMP_SPEED
    CLAY_STATUS


# ── Ceilings ────────────────────────────────────────────────────────────────
[gcode_macro CLAY_SET_LIMITS]
description: Set THE extrusion ceiling in mm3/s. Both motors' caps follow from it
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    {% set mf = ([params.MAX_FLOW|default(c.max_flow)|float, 10]|max)|round(0)|int %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=max_flow VALUE={mf}
    SAVE_VARIABLE VARIABLE=clay_max_flow VALUE={mf}
    _CLAY_RECALC
    _CLAY_CLAMP_SPEED
    {% set n = printer["gcode_macro CLAY"] %}
    RESPOND MSG="Clay ceiling {mf} mm3/s -> effective {n.flow_cap|int} mm3/s ({'%.1f'|format(n.flow_cap|float*0.06)} mL/min) = auger {n.max_auger_rpm|int} RPM, plunger {'%.0f'|format(n.flow_cap|float*60/(n.barrel_area|float*n.plunger_base_rd|float))} RPM"


# ── Jog ─────────────────────────────────────────────────────────────────────
# One chunk of a press-and-hold jog, driven by the KlipperScreen clay panel.
# The panel sizes D so that the stream of chunks matches real time, which keeps
# Klipper's queue holding only a fraction of a second of travel — that queue
# depth is exactly the overrun you get when the finger lifts.
#
# D is in mm3 and F in mm3/min, because E is volumetric now.
#
# Deliberately atomic (save/restore per chunk) so an interrupted hold can never
# leave the printer latched in relative-E mode.
# The panel brackets every press-and-hold with these. Acceleration has to be
# raised BEFORE the chunks are queued, because Klipper bakes a move's
# acceleration in when the move is planned — restoring it on release therefore
# cannot lengthen the stop that is already scheduled.
[gcode_macro CLAY_JOG_BEGIN]
description: Raise acceleration for a press-and-hold jog (called by the clay panel)
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    # MINIMUM_CRUISE_RATIO=0 matters as much as the acceleration here. At the
    # configured 0.5, Klipper insists at least half of every move is spent at
    # cruise speed, which caps how hard a short move may decelerate — and the
    # last chunk of a hold is exactly that: a short move that has to stop.
    SET_VELOCITY_LIMIT VELOCITY={c.load_max_rpm|float * c.plunger_base_rd|float / 60 if c.mode == 'load' else c.jog_velocity} ACCEL={c.load_accel_eff if c.mode == 'load' else c.jog_accel} MINIMUM_CRUISE_RATIO=0


[gcode_macro CLAY_JOG_END]
description: Restore acceleration after a press-and-hold jog (called by the clay panel)
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    # Back to the mode's resting values, never left at the jog setting: in
    # extrude mode that number is also the XY acceleration a print would use.
    {% if c.mode == 'load' %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={c.load_accel_eff} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    {% else %}
        # The cap, if one is armed — NOT the configured limits. Priming by hand
        # at the print-start pause goes through here, and handing the resumed
        # print back its full 500 mm/s2 would undo the whole guarantee.
        _CLAY_TOOLHEAD_LIMITS
    {% endif %}


[gcode_macro CLAY_JOG]
description: One rate-matched jog chunk (used by the clay touchscreen panel)
gcode:
    {% set d = params.D|default(0)|float %}
    {% set f = params.F|default(1000)|int %}
    {% if d != 0 %}
        SAVE_GCODE_STATE NAME=_clay_jog
        M83
        G1 E{d} F{f}
        RESTORE_GCODE_STATE NAME=_clay_jog
    {% endif %}


# ── Auger characterisation ──────────────────────────────────────────────────
# Run the auger a known number of revolutions under real load, with the plunger
# synced as always. Use it two ways:
#   - step RPM up until the motor skips, to find max_auger_rpm
#   - hold a candidate balance and watch the pressure behaviour, to find auger_eff
[gcode_macro CLAY_AUGER_SPIN]
description: Turn the auger an exact number of revolutions at a given RPM, plunger synced
gcode:
    # print_stats, not idle_timeout: a PAUSED print must still allow this, and
    # idle_timeout reports "Printing" for any activity at all, jogging included.
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("CLAY_AUGER_SPIN: not while printing") }
    {% endif %}
    {% set c = printer["gcode_macro CLAY"] %}
    {% set revs = params.REVS|default(10)|float %}
    {% set req = params.RPM|default(c.flow|float * c.balance|float * 60 / c.auger_vol_rev|float)|float %}
    # max_auger_rpm already folds in both the plunger's flow ceiling and the
    # auger's own motor limit. min() rather than an if-block: a {% set %} inside
    # {% if %} does not escape the block in Jinja2, so the clamp would silently
    # do nothing.
    # FORCE=1 lifts the clamp, because finding the ceiling means exceeding the
    # one currently believed. Still bounded absolutely: past ~1200 RPM a direct
    # NEMA 17 has no useful torque left and the test stops meaning anything.
    {% set force = params.FORCE|default(0)|int %}
    {% set rpm = req if force else [req, c.max_auger_rpm|float]|min %}
    {% set rpm = [rpm, 1200]|min %}
    # THE SCREW'S ROTATION DISTANCE IS NOT auger_vol_rev. E is plunger-
    # referenced and the balance lives on the auger, so one auger revolution is
    # auger_vol_rev/balance of E — and a macro that used auger_vol_rev here
    # turned the screw `balance` times too far, at `balance` times the stated
    # speed. At 1:20.95, REVS=20 RPM=400 meant 419 revolutions at 8380 RPM.
    {% set ard = c.auger_vol_rev|float / c.balance|float %}
    {% set vol = revs * ard %}
    {% if req > rpm %}
        RESPOND MSG="SPIN: {req|int} RPM clamped to {rpm|round(0)|int} RPM (FORCE=1 to override)"
    {% endif %}
    RESPOND MSG="SPIN: {revs} auger rev at {rpm|round(0)|int} RPM = {'%.1f'|format(vol/1000)} mL over {'%.1f'|format(revs/rpm*60)}s. Plunger travels {'%.2f'|format(vol / c.barrel_area|float)}mm."
    _CLAY_APPLY
    SAVE_GCODE_STATE NAME=_clay_spin
    # Velocity: the jog ceiling, or the spin would silently be held to 100 mm3/s
    # by max_velocity however high RPM says, and the test would measure nothing.
    #
    # Acceleration: bounded in the AUGER's own units. jog_accel is 20000 mm3/s2,
    # which at this rotation distance is 2141 rev/s2 — the screw would stall on
    # the ramp every time and the test would report a ceiling far below the real
    # one. A speed test whose ramp is untestable measures the ramp.
    SET_VELOCITY_LIMIT VELOCITY={c.jog_velocity} ACCEL={c.auger_max_accel|float * ard} MINIMUM_CRUISE_RATIO=0
    M83
    G1 E{vol} F{rpm * ard * 1.0}
    M400
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel}
    RESTORE_GCODE_STATE NAME=_clay_spin
    RESPOND MSG="SPIN: done. If the auger buzzed or lost sync, the ceiling is below {rpm|round(0)|int} RPM — otherwise CLAY_SET_AUGER_MAX_RPM RPM={(rpm*0.8)|round(0)|int} or higher."


# Adopt the balance you tuned by eye as the new 1:1. This is the only honest way
# to set auger_eff: the extruded weight only ever measures the plunger (sealed
# positive-displacement chain), so the auger's real delivery can only be found
# as the balance at which barrel pressure neither builds nor falls.
#
# The applied plunger rotation distance is unchanged by this — extrusion behaves
# exactly as it did a moment ago. What changes is that E now means the right
# number of mm3, so gcode written against the old figure must be rescaled.
[gcode_macro CLAY_AUGER_ZERO]
description: Fold the current balance into auger_eff and reset balance to 1.00
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    {% set b = c.balance|float %}
    {% if b <= 0 %}
        { action_raise_error("CLAY_AUGER_ZERO: balance must be positive") }
    {% endif %}
    {% set e = ((c.auger_eff|float / b * 10000)|round(0)|int) / 10000 %}
    RESPOND MSG="AUGER: adopting 1:{'%.2f'|format(b)} as the new 1:1 -> auger_eff {c.auger_eff} to {e} ({'%.1f'|format(e*100)}% of geometric)"
    RESPOND MSG="AUGER: extrusion is unchanged, but 1 E mm now means a different mm3. Rescale existing gcode E by {'%.4f'|format(1/b)}."
    CLAY_SET_AUGER_EFF EFF={e}
    CLAY_SET_BALANCE BALANCE=1.00


[gcode_macro CLAY_SET_AUGER_EFF]
description: Set the auger volumetric efficiency (delivered / geometric, 0-1)
gcode:
    {% set e = params.EFF|float %}
    {% if e <= 0 or e > 1.5 %}
        { action_raise_error("CLAY_SET_AUGER_EFF: EFF must be between 0 and 1.5") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=auger_eff VALUE={e}
    SAVE_VARIABLE VARIABLE=clay_auger_eff VALUE={e}
    _CLAY_RECALC
    _CLAY_APPLY
    _CLAY_CLAMP_SPEED
    RESPOND MSG="Auger efficiency {e} -> {'%.2f'|format(printer['gcode_macro CLAY'].auger_vol_rev|float)} mm3 per revolution"


[gcode_macro CLAY_SET_AUGER_GEOM]
description: Set auger screw geometry. OD= CORE= PITCH= FLIGHT= (mm)
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    {% set od = params.OD|default(c.auger_od)|float %}
    {% set co = params.CORE|default(c.auger_core)|float %}
    {% set pi = params.PITCH|default(c.auger_pitch)|float %}
    {% set fl = params.FLIGHT|default(c.auger_flight)|float %}
    {% if od <= co or pi <= fl or co <= 0 or fl < 0 %}
        { action_raise_error("CLAY_SET_AUGER_GEOM: need OD>CORE>0 and PITCH>FLIGHT>=0") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=auger_od VALUE={od}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=auger_core VALUE={co}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=auger_pitch VALUE={pi}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=auger_flight VALUE={fl}
    SAVE_VARIABLE VARIABLE=clay_auger_od VALUE={od}
    SAVE_VARIABLE VARIABLE=clay_auger_core VALUE={co}
    SAVE_VARIABLE VARIABLE=clay_auger_pitch VALUE={pi}
    SAVE_VARIABLE VARIABLE=clay_auger_flight VALUE={fl}
    _CLAY_RECALC
    _CLAY_APPLY
    _CLAY_CLAMP_SPEED
    {% set geo = 0.785398163 * (od**2 - co**2) * (pi - fl) %}
    RESPOND MSG="Auger {od}/{co}mm, pitch {pi}mm, flight {fl}mm = {'%.1f'|format(geo)} mm3/rev geometric, {'%.1f'|format(geo * c.auger_eff|float)} mm3/rev delivered"


# ── Plunger calibration ─────────────────────────────────────────────────────
# plunger_base_rd is the one measurable fact about the plunger drivetrain: how
# many mm the plunger travels for one revolution of the motor. Everything else
# is derived from it, so it is worth measuring rather than guessing.
#
# CLAY_CAL_MOVE turns the motor an exact number of revolutions with the plunger
# unsynced, so you can measure the travel with calipers and divide. Setting the
# rotation distance to 1.0 for the move is the trick: it makes one mm of
# commanded E equal exactly one motor revolution, whatever the current value is.
[gcode_macro CLAY_CAL_MOVE]
description: Plunger-only move of an exact number of motor revolutions, for calibration
gcode:
    # print_stats, not idle_timeout: a PAUSED print must still allow this, and
    # idle_timeout reports "Printing" for any activity at all, jogging included.
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("CLAY_CAL_MOVE: not while printing") }
    {% endif %}
    {% set revs = params.REVS|default(20)|float %}
    {% set req  = params.RPM|default(60)|float %}
    # min() rather than an if-block: a {% set %} inside {% if %} does not escape
    # the block in Jinja2, so the clamp would silently do nothing.
    {% set rpm  = [req, printer["gcode_macro CLAY"].plunger_max_rpm|float]|min %}
    # Acceleration matters as soon as you test high RPM. While this macro runs,
    # the rotation distance is 1.0, so E units are revolutions and the config's
    # max_extrude_only_accel means rev/s^2 — violent enough that the motor would
    # stall on the ramp long before reaching its real speed ceiling, and you
    # would blame the wrong thing. ACCEL is in rev/s^2.
    {% set accel = params.ACCEL|default(20)|float %}
    {% if req > rpm %}
        RESPOND MSG="CAL: {req} RPM exceeds the {rpm} RPM plunger ceiling, clamped."
    {% endif %}
    RESPOND MSG="CAL: mark the plunger position NOW. Moving {revs} rev at {rpm} RPM, accel {accel} rev/s^2."
    SAVE_GCODE_STATE NAME=_clay_cal
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder1 DISTANCE=1.0
    SET_VELOCITY_LIMIT ACCEL={accel}
    M83
    G1 E{revs} F{rpm}
    M400
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    RESTORE_GCODE_STATE NAME=_clay_cal
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    _CLAY_APPLY
    RESPOND MSG="CAL: expected travel {'%.2f'|format(revs * printer['gcode_macro CLAY'].plunger_base_rd|float)}mm. Short = lost steps."


# The plunger uses a rotating nut driving a non-rotating screw, and the nut is
# inside the gearbox — so no rotation anywhere in the drivetrain can be observed
# or counted. Commanded motor revolutions against measured linear travel is the
# only available measurement, which makes this the whole calibration.
[gcode_macro CLAY_CAL_APPLY]
description: Turn a measured CLAY_CAL_MOVE run into plunger_base_rd. REVS= commanded, DIST= measured mm
gcode:
    {% set revs = params.REVS|float %}
    {% set dist = params.DIST|float %}
    {% set lead = params.LEAD|default(4.0)|float %}
    {% if revs <= 0 or dist <= 0 %}
        { action_raise_error("CLAY_CAL_APPLY: REVS and DIST must both be positive") }
    {% endif %}
    {% set rd = dist / revs %}
    RESPOND MSG="CAL: {dist}mm over {revs} rev = {'%.4f'|format(rd)} mm/rev"
    RESPOND MSG="CAL: {'%.1f'|format(3200 / rd)} microsteps/mm, implied gearbox {'%.3f'|format(lead / rd)}:1 for a {lead}mm lead"
    CLAY_SET_PLUNGER_RD RD={rd}


[gcode_macro CLAY_SET_BARREL]
description: Set the clay barrel bore diameter in mm (converts plunger travel to volume)
gcode:
    {% set d = params.DIAMETER|float %}
    {% if d <= 0 %}
        { action_raise_error("CLAY_SET_BARREL: DIAMETER must be positive") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=barrel_diameter VALUE={d}
    SAVE_VARIABLE VARIABLE=clay_barrel_diameter VALUE={d}
    _CLAY_RECALC
    _CLAY_APPLY
    _CLAY_CLAMP_SPEED
    {% set area = 0.785398163 * d ** 2 %}
    RESPOND MSG="Barrel {d}mm bore = {'%.0f'|format(area)} mm2, so 1mm of plunger travel = {'%.2f'|format(area/1000)} mL"


# What a given bead demands of both motors. The auger sets the flow and the
# plunger has to supply the volume, so a bead can be out of reach either way.
[gcode_macro CLAY_FLOW_CALC]
description: Motor rates needed for a bead. WIDTH/HEIGHT mm, SPEED mm/s
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    {% set w = params.WIDTH|default(4)|float %}
    {% set h = params.HEIGHT|default(3)|float %}
    {% set v = params.SPEED|default(100)|float %}
    {% set q = w * h * v %}
    {% set arpm = q * 60 * c.balance|float / c.auger_vol_rev|float %}
    {% set prpm = q * 60 / (c.barrel_area|float * c.plunger_base_rd|float) %}
    RESPOND MSG="Bead {w}x{h}mm at {v}mm/s needs {'%.0f'|format(q)} mm3/s ({'%.1f'|format(q*0.06)} mL/min) = {'%.0f'|format(q/c.flow_cap|float*100)}% of the {c.flow_cap|int} mm3/s ceiling"
    RESPOND MSG="That is auger {'%.0f'|format(arpm)} RPM and plunger {'%.1f'|format(prpm)} RPM"
    {% if q > c.flow_cap|float %}
        RESPOND MSG="WARNING: above the ceiling. Max XY for this bead is {'%.0f'|format(v * c.flow_cap|float / q)} mm/s"
    {% endif %}


# VERIFIED 2026-08-10: 10 commanded revolutions turned the screw exactly 10
# times. That confirms the one purely mechanical claim under everything
# volumetric here — that a commanded motor revolution really is one physical
# revolution — and with it full_steps_per_rotation 200 (a 1.8 deg motor; 0.9 deg
# would have given 20 turns and made every flow figure wrong by 2x) and a
# genuinely 1:1 coupling with no hidden reduction. Microsteps were 16 at the
# time of the test and are 1 now; the test is unaffected, because it sets the
# rotation distance to 1.0 and asks for whole revolutions either way.
#
# Re-run this after any change to the auger motor or its coupling: mark the
# coupler, turn a whole number of revolutions, see whether the mark comes back. Setting the rotation
# distance to 1.0 for the move makes one mm of commanded E equal exactly one
# motor revolution, whatever the configured value happens to be.
#
# The plunger is parked on its own motion queue for the duration, so this turns
# the screw and nothing else.
[gcode_macro CLAY_AUGER_TURN]
description: Turn the auger an exact number of revolutions to verify steps/rotation
gcode:
    # print_stats, not idle_timeout: a PAUSED print must still allow this, and
    # idle_timeout reports "Printing" for any activity at all, jogging included.
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("CLAY_AUGER_TURN: not while printing") }
    {% endif %}
    {% set revs = params.REVS|default(10)|float %}
    {% set rpm = params.RPM|default(30)|float %}
    {% set accel = params.ACCEL|default(20)|float %}
    RESPOND MSG="TURN: mark the auger coupler NOW. Turning {revs} full revolutions at {rpm} RPM."
    RESPOND MSG="TURN: plunger parked. Takes {'%.0f'|format(revs / rpm * 60)}s."
    SAVE_GCODE_STATE NAME=_clay_turn
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE=1.0
    SET_VELOCITY_LIMIT ACCEL={accel}
    M83
    G1 E{revs} F{rpm}
    M400
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    RESTORE_GCODE_STATE NAME=_clay_turn
    _CLAY_RECALC
    _CLAY_APPLY
    RESPOND MSG="TURN: done. Mark back at the start = 200 full steps/rev confirmed."
    RESPOND MSG="TURN: turning twice as far means a 0.9deg motor (400 full steps), and every flow figure is out by 2x"


[gcode_macro CLAY_SET_AUGER_MAX_RPM]
description: Set the auger motor speed ceiling in RPM (a machine limit, not a process setting)
gcode:
    {% set rpm = params.RPM|float %}
    {% if rpm <= 0 %}
        { action_raise_error("CLAY_SET_AUGER_MAX_RPM: RPM must be positive") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=auger_motor_max_rpm VALUE={rpm}
    SAVE_VARIABLE VARIABLE=clay_auger_motor_max_rpm VALUE={rpm}
    _CLAY_RECALC
    _CLAY_CLAMP_SPEED
    {% set c = printer["gcode_macro CLAY"] %}
    RESPOND MSG="Auger motor ceiling {rpm} RPM -> flow cap {c.flow_cap|int} mm3/s = auger {c.max_auger_rpm|int} RPM"


[gcode_macro CLAY_SET_Z_OFFSET]
description: Z=<mm> — lift the whole print off the bed. Positive raises the nozzle.
gcode:
    {% set z = params.Z|default(0)|float %}
    # A guard, not a preference: this is applied blind at the start of every
    # print, and a large negative value drives the nozzle into the bed before
    # anyone can react.
    {% if z < -2.0 or z > 10.0 %}
        { action_raise_error("CLAY_SET_Z_OFFSET: %.2f mm is outside -2..10" % z) }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=z_offset VALUE={z}
    SAVE_VARIABLE VARIABLE=clay_z_offset VALUE={z}
    # Apply it immediately if the machine is already homed and idle, so the
    # effect can be seen without starting a print.
    {% if printer.print_stats.state != "printing" and printer.toolhead.homed_axes == "xyz" %}
        SET_GCODE_OFFSET Z={z} MOVE=0
    {% endif %}
    RESPOND MSG="Clay Z offset {'%+.2f'|format(z)} mm — the nozzle sits this much above nominal for the whole print."


[gcode_macro CLAY_SET_PLUNGER_MAX_RPM]
description: Set the plunger motor speed ceiling in RPM (a machine limit, not a process setting)
gcode:
    {% set rpm = params.RPM|float %}
    {% if rpm <= 0 %}
        { action_raise_error("CLAY_SET_PLUNGER_MAX_RPM: RPM must be positive") }
    {% endif %}
    {% set c = printer["gcode_macro CLAY"] %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=plunger_max_rpm VALUE={rpm}
    SAVE_VARIABLE VARIABLE=clay_plunger_max_rpm VALUE={rpm}
    RESPOND MSG="Plunger ceiling {rpm} RPM = {'%.2f'|format(rpm * c.plunger_base_rd|float / 60)} mm/s of plunger travel"


[gcode_macro CLAY_SET_PLUNGER_RD]
description: Store the measured plunger travel per motor revolution (mm)
gcode:
    {% set rd = params.RD|float %}
    {% if rd <= 0 %}
        { action_raise_error("RD must be positive") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=plunger_base_rd VALUE={rd}
    SAVE_VARIABLE VARIABLE=clay_plunger_base_rd VALUE={rd}
    _CLAY_RECALC
    _CLAY_APPLY
    _CLAY_CLAMP_SPEED
    RESPOND MSG="plunger_base_rd={rd} mm/rev -> {'%.1f'|format(3200 / rd)} microsteps/mm, implied gearbox {'%.3f'|format(4.0 / rd)}:1 for a 4mm lead"


# ── Status ──────────────────────────────────────────────────────────────────
[gcode_macro CLAY_STATUS]
description: Report balance, flow, both motor rates and the sync state
gcode:
    {% set c = printer["gcode_macro CLAY"] %}
    {% set vr = c.auger_vol_rev|float %}
    {% set geo = 0.785398163 * (c.auger_od|float**2 - c.auger_core|float**2) * (c.auger_pitch|float - c.auger_flight|float) %}
    {% set flow = c.flow|float %}
    {% set arpm = flow * c.balance|float * 60 / vr %}
    {% set prpm = flow * 60 / (c.barrel_area|float * c.plunger_base_rd|float) %}
    {% set prd = c.barrel_area|float * c.plunger_base_rd|float %}
    {% set mq = printer.extruder1.motion_queue %}
    {% if c.mode == 'load' %}
        RESPOND MSG="Clay: LOAD MODE - plunger alone at {c.load_rpm|int} RPM ({'%.2f'|format(c.load_rpm|float * c.plunger_base_rd|float / 60)} mm/s), auger parked. E is mm of plunger travel."
    {% endif %}
    RESPOND MSG="Clay: flow {flow|int} mm3/s ({'%.1f'|format(flow*0.06)} mL/min) at balance 1:{'%.2f'|format(c.balance|float)}"
    RESPOND MSG="Clay: -> auger {'%.0f'|format(arpm)} RPM, plunger {'%.1f'|format(prpm)} RPM ({'%.3f'|format(prpm * c.plunger_base_rd|float / 60)} mm/s)"
    RESPOND MSG="Clay: auger {'%.1f'|format(vr)} mm3/rev ({'%.0f'|format(c.auger_eff|float*100)}% of {'%.1f'|format(geo)} geometric); barrel {c.barrel_diameter}mm = {'%.0f'|format(c.barrel_area|float)}mm2"
    RESPOND MSG="Clay: ceiling {c.flow_cap|int} mm3/s = {'%.0f'|format(flow/c.flow_cap|float*100)}% used; set {c.max_flow|int}, motors max {c.plunger_max_rpm|int}/{c.auger_motor_max_rpm|int} RPM"
    {% if c.print_bead|float > 0 %}
        {% set ard = vr / c.balance|float %}
        {% set v = [c.auger_motor_max_rpm|float / 60 * ard / c.print_bead|float, printer.configfile.settings.printer.max_velocity]|min %}
        RESPOND MSG="Clay: PRINT CAP ARMED - {'%.2f'|format(c.print_bead|float)} mm2 bead, XY <= {'%.2f'|format(v)} mm/s = {'%.0f'|format(v*c.print_bead|float)} mm3/s"
    {% endif %}
    RESPOND MSG="Clay: Z offset {'%+.2f'|format(c.z_offset|float)} mm (applied at print start; live {'%+.2f'|format(printer.gcode_move.homing_origin[2])})"
    RESPOND MSG="Clay: 1 E mm = 1 mm3 out. auger_rd={'%.2f'|format(vr / c.balance|float)} plunger_rd={'%.1f'|format(prd)} active={printer.toolhead.extruder} plunger_follows={mq if mq else 'NOTHING (unsynced!)'}"


# ── Restore saved settings and re-assert sync at every Klipper start ─────────
[gcode_macro _CLAY_LOAD_SAVED]
gcode:
    {% set sv = printer.save_variables.variables %}
    {% if 'clay_z_offset' in sv %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=z_offset VALUE={sv.clay_z_offset}
    {% endif %}
    {% if 'clay_plunger_base_rd' in sv %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=plunger_base_rd VALUE={sv.clay_plunger_base_rd}
    {% endif %}
    {% if 'clay_barrel_diameter' in sv %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=barrel_diameter VALUE={sv.clay_barrel_diameter}
    {% endif %}
    {% if 'clay_auger_od' in sv %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=auger_od VALUE={sv.clay_auger_od}
    {% endif %}
    {% if 'clay_auger_core' in sv %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=auger_core VALUE={sv.clay_auger_core}
    {% endif %}
    {% if 'clay_auger_pitch' in sv %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=auger_pitch VALUE={sv.clay_auger_pitch}
    {% endif %}
    {% if 'clay_auger_flight' in sv %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=auger_flight VALUE={sv.clay_auger_flight}
    {% endif %}
    {% if 'clay_auger_eff' in sv %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=auger_eff VALUE={sv.clay_auger_eff}
    {% endif %}
    {% if 'clay_plunger_max_rpm' in sv %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=plunger_max_rpm VALUE={sv.clay_plunger_max_rpm}
    {% endif %}
    {% if 'clay_max_flow' in sv %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=max_flow VALUE={sv.clay_max_flow}
    {% endif %}
    {% if 'clay_auger_motor_max_rpm' in sv %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=auger_motor_max_rpm VALUE={sv.clay_auger_motor_max_rpm}
    {% endif %}
    # Geometry first, then the derived volume, then anything clamped against it.
    _CLAY_RECALC
    {% if 'clay_balance' in sv %}
        # Through CLAY_SET_BALANCE rather than a raw set, so a value saved under
        # different geometry is clamped into the current band instead of being
        # restored verbatim.
        CLAY_SET_BALANCE BALANCE={sv.clay_balance}
    {% endif %}
    {% if 'clay_flow' in sv %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=flow VALUE={sv.clay_flow}
    {% endif %}
    {% if 'clay_load_max_rpm' in sv %}
        SET_GCODE_VARIABLE MACRO=CLAY VARIABLE=load_max_rpm VALUE={sv.clay_load_max_rpm}
    {% endif %}
    {% if 'clay_load_rpm' in sv %}
        # Through the setter so a value saved against a different plunger
        # ceiling is clamped rather than restored verbatim.
        CLAY_SET_LOAD_RPM RPM={sv.clay_load_rpm}
    {% endif %}


[delayed_gcode CLAY_STARTUP_SYNC]
initial_duration: 1.0
gcode:
    _CLAY_LOAD_SAVED
    _CLAY_RECALC
    _CLAY_APPLY
    _CLAY_CLAMP_SPEED
