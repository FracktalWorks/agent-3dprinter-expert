# Fracktal Works base image: kernel hardening + SD write-back tuning
# Self-recover from a kernel crash instead of hanging
kernel.panic = 10
kernel.panic_on_oops = 1
# Don't leak kernel addresses / dmesg to unprivileged users
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# SysRq: only sync(16) + remount-ro(32) + reboot(128) for field recovery
kernel.sysrq = 176
# Network
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
# Smaller dirty-page backlog => less data at risk on power cut
vm.dirty_background_ratio = 2
vm.dirty_ratio = 5
vm.dirty_expire_centisecs = 1500
