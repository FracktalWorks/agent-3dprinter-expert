# Fracktal Works base image. Password login stays ON by design (fleet support access).
# @FW_USER@ is replaced by apply.sh (--user). A wrong user here would lock everyone out.
PasswordAuthentication yes
PermitRootLogin no
X11Forwarding no
AllowUsers @FW_USER@
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 60
ClientAliveCountMax 3
